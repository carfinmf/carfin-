<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARFIN – Vehicle Valuation</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#000;
  color:#ffd200;
}
.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
  margin-bottom:25px;
}
label{
  display:block;
  margin-top:15px;
  font-size:14px;
}
input, select, textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:6px;
  border:none;
  font-size:14px;
}
textarea{resize:vertical}
button{
  width:100%;
  margin-top:18px;
  padding:14px;
  background:#ffd200;
  color:#000;
  border:none;
  font-size:16px;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}
small{
  color:#aaa;
  font-size:12px;
}
hr{
  border:0;
  border-top:1px solid #333;
  margin:20px 0;
}
.footer{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:30px;
}
</style>
</head>

<body>
<div class="container">
<h1>Vehicle Valuation</h1>

<input type="hidden" name="_subject" value="New Vehicle Valuation Request">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">

<input type="hidden" name="_subject" value="New Vehicle Valuation Request">
<input type="hidden" name="_captcha" value="false">

<label>Name</label>
<input name="Name" required>

<label>Phone</label>
<input name="Phone" required>

<label>Email (optional)</label>
<input name="Email">

<label>Car Brand</label>
<input name="Brand" placeholder="Toyota, Nissan, BMW" required>

<label>Model</label>
<input name="Model" required>

<label>Year</label>
<input name="Year" required>

<label>Mileage (km)</label>
<input name="Mileage" required>

<label>Condition</label>
<select name="Condition">
  <option>Excellent</option>
  <option>Good</option>
  <option>Average</option>
  <option>Poor</option>
</select>

<label>Notes</label>
<textarea name="Notes" placeholder="Accident, finance, issues..."></textarea>

<hr>

<h3>Required Photos</h3>

<label>Front View</label>
<input type="file" name="Front View" accept="image/*" required>

<label>Rear View</label>
<input type="file" name="Rear View" accept="image/*" required>

<label>Left Side</label>
<input type="file" name="Left Side" accept="image/*" required>

<label>Right Side</label>
<input type="file" name="Right Side" accept="image/*" required>

<label>Odometer</label>
<input type="file" name="Odometer" accept="image/*" required>

<label>VIN / Chassis Plate</label>
<input type="file" name="VIN Plate" accept="image/*">

<label>Engine Bay</label>
<input type="file" name="Engine" accept="image/*">

<label>Interior</label>
<input type="file" name="Interior" accept="image/*">

<label>Car Documents</label>
<input type="file" name="Documents" accept="image/*,application/pdf">

<hr>

<small>
Photos will be sent to CARFIN email for valuation processing.
</small>

<button type="submit">Submit Valuation</button>

</form>

<div class="footer">
© CARFIN – Vehicle Valuation
</div>
</div>
</body>
</html>
