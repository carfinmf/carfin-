<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Carfin | Evaluation</title>
  <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <div class="brand"><img src="../assets/img/logo.png" alt="Carfin"/></div>
      <div class="nav-links">
        <a class="pill" href="../index.html">Home</a>
        <a class="pill" href="./insurance.html">Insurance</a>
        <a class="pill" href="./finance.html">Finance</a>
        <button id="langBtn" class="pill lang-btn">AR</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2 style="margin:0;font-weight:950">Vehicle Evaluation (No Login)</h2>
      <p style="margin:8px 0 0;color:var(--muted);font-weight:650">
        Photos are not allowed for evaluation in this version.
      </p>

      <form class="form" id="evalForm">
        <div class="field">
          <label>Plate Number</label>
          <input required placeholder="e.g. Dubai A 12345"/>
        </div>
        <div class="field">
          <label>Make</label>
          <input required placeholder="e.g. Toyota"/>
        </div>
        <div class="field">
          <label>Model</label>
          <input required placeholder="e.g. Land Cruiser"/>
        </div>
        <div class="field">
          <label>Year</label>
          <input required type="number" min="1990" max="2026" placeholder="2020"/>
        </div>
        <div class="field">
          <label>Mileage (km)</label>
          <input required type="number" min="0" placeholder="85000"/>
        </div>
        <div class="field">
          <label>Specs</label>
          <select required>
            <option value="">Select</option>
            <option>GCC</option>
            <option>Non-GCC</option>
          </select>
        </div>

        <div class="field" style="grid-column:1/-1">
          <label>Notes (optional)</label>
          <textarea placeholder="Any details…"></textarea>
          <div class="help">Submit will show confirmation only. It will NOT go to admin panel.</div>
        </div>

        <div style="grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary" type="submit">Submit Evaluation</button>
          <a class="btn" href="../index.html">Back</a>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById("evalForm").addEventListener("submit",(e)=>{
      e.preventDefault();
      // IMPORTANT: do NOT save to admin.
      window.location.href = "./evaluation-success.html";
    });
  </script>
</body>
</html>
